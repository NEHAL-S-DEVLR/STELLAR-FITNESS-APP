<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stellar Fitness Club — Gym Pass</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Bebas+Neue&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    @media print {
      body * { visibility: hidden; }
      #pass-card, #pass-card * { visibility: visible; }
      #pass-card { position: absolute; top: 0; left: 0; }
      .no-print { display: none !important; }
    }
    #pass-card {
      width: 380px; max-width: 92vw; border-radius: 20px; overflow: hidden;
      background: linear-gradient(145deg, #14161a, #1f2227);
      color: #fff; margin: 0 auto; box-shadow: 0 20px 50px rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.08);
    }
    #pass-card .head { padding: 20px 22px 14px; display:flex; align-items:center; gap:12px; }
    #pass-card .head .logo { width:38px; height:38px; border-radius:10px; background:var(--md-primary); display:flex; align-items:center; justify-content:center; font-weight:700; color:#111; }
    #pass-card .head .name { font-family:'Bebas Neue', sans-serif; letter-spacing:1px; font-size:20px; }
    #pass-card .body-row { display:flex; gap:16px; padding: 6px 22px 18px; align-items:center; }
    #pass-card .photo { width:76px; height:76px; border-radius:14px; object-fit:cover; background:#333; flex-shrink:0; }
    #pass-card .meta { flex:1; min-width:0; }
    #pass-card .meta .mname { font-size:18px; font-weight:600; margin-bottom:2px; }
    #pass-card .meta .mid { font-family: 'JetBrains Mono', monospace; font-size:12px; color:#aaa; margin-bottom:8px; }
    #pass-card .status { display:inline-block; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; }
    #pass-card .status.active { background:rgba(60,200,120,.18); color:#5be08e; }
    #pass-card .status.expired { background:rgba(230,80,80,.18); color:#ff8080; }
    #pass-card .status.inactive { background:rgba(150,150,150,.18); color:#bbb; }
    #pass-card .divider { height:1px; background:rgba(255,255,255,.08); margin: 0 22px; }
    #pass-card .details { padding: 16px 22px; display:grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; font-size: 12px; }
    #pass-card .details .lbl { color:#8a8f99; text-transform:uppercase; letter-spacing:.5px; font-size:10px; margin-bottom:2px; }
    #pass-card .details .val { font-weight:500; }
    #pass-card .qr-wrap { display:flex; justify-content:center; padding: 8px 22px 24px; }
    #pass-card .qr-wrap img { width:120px; height:120px; border-radius:10px; background:#fff; padding:8px; }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div style="width:100%;">
      <div class="flex between no-print" style="max-width:420px; margin:0 auto 18px;">
        <a href="/" class="back-home"><span class="material-symbols-rounded">arrow_back</span> Back</a>
      </div>

      <div id="pass-card">
        <div class="head">
          <div class="logo">SF</div>
          <div>
            <div class="name">STELLAR FITNESS CLUB</div>
            <div style="font-size:11px; color:#aaa;">Digital Membership Pass</div>
          </div>
        </div>
        <div class="divider"></div>
        <div class="body-row">
          <img class="photo" id="pp-photo" src="" alt="" />
          <div class="meta">
            <div class="mname" id="pp-name">—</div>
            <div class="mid" id="pp-id">—</div>
            <span class="status" id="pp-status">—</span>
          </div>
        </div>
        <div class="divider"></div>
        <div class="details">
          <div><div class="lbl">Plan</div><div class="val" id="pp-plan">—</div></div>
          <div><div class="lbl">Valid Until</div><div class="val" id="pp-expiry">—</div></div>
          <div><div class="lbl">Batch</div><div class="val" id="pp-batch">—</div></div>
          <div><div class="lbl">Trainer</div><div class="val" id="pp-trainer">—</div></div>
          <div><div class="lbl">Member Since</div><div class="val" id="pp-since">—</div></div>
          <div><div class="lbl">Type</div><div class="val" id="pp-type">—</div></div>
        </div>
        <div class="qr-wrap"><img id="pp-qr" src="" alt="Verification QR" /></div>
      </div>

      <div class="flex gap no-print" style="max-width:420px; margin:18px auto 0; justify-content:center;">
        <button class="btn btn-filled" id="pp-print"><span class="material-symbols-rounded">print</span>Print / Save</button>
      </div>
    </div>
  </div>

  <script src="/api.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const memberId = params.get('id');

    function fmtDate(d) {
      return d ? new Date(d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
    }

    async function load() {
      if (!Auth.token) { location.href = `/login.html?next=${encodeURIComponent(location.pathname + location.search)}`; return; }
      try {
        const path = memberId ? `/api/admin/members/${memberId}/gym-pass` : '/api/me/gym-pass';
        const p = await api(path);
        document.getElementById('pp-photo').src = p.photoUrl || 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="76" height="76"><rect width="100%" height="100%" fill="#333"/></svg>`);
        document.getElementById('pp-name').textContent = p.name;
        document.getElementById('pp-id').textContent = p.memberId;
        const statusEl = document.getElementById('pp-status');
        statusEl.textContent = p.status;
        statusEl.className = `status ${p.status}`;
        document.getElementById('pp-plan').textContent = p.plan || '—';
        document.getElementById('pp-expiry').textContent = fmtDate(p.expiryDate);
        document.getElementById('pp-batch').textContent = p.batchName || '—';
        document.getElementById('pp-trainer').textContent = p.trainerName || '—';
        document.getElementById('pp-since').textContent = fmtDate(p.memberSince);
        document.getElementById('pp-type').textContent = p.memberType === 'pt' ? 'Personal Training' : 'Regular';
        document.getElementById('pp-qr').src = p.qrDataUrl;
      } catch (e) {
        document.getElementById('pp-name').textContent = 'Could not load pass';
        document.getElementById('pp-id').textContent = e.message;
      }
    }

    document.getElementById('pp-print').addEventListener('click', () => window.print());
    load();
  </script>
</body>
</html>
