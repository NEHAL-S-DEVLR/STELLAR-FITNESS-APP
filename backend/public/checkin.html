<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stellar Fitness Club — Check In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Bebas+Neue&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card" style="text-align:center;">
      <div class="brand" style="justify-content:center;">
        <div class="logo">SF</div>
        <div>Stellar Fitness Club</div>
      </div>

      <div id="checkin-state" style="padding: 32px 0;">
        <span class="material-symbols-rounded" style="font-size:48px; color:var(--md-primary);">hourglass_top</span>
        <p class="sub" style="margin-top:12px;">Checking you in…</p>
      </div>

    </div>
  </div>

  <script src="/api.js"></script>
  <script>
    const stateEl = document.getElementById('checkin-state');
    const params = new URLSearchParams(location.search);
    const token = params.get('t');

    function render(icon, color, title, sub) {
      stateEl.innerHTML = `
        <span class="material-symbols-rounded" style="font-size:48px; color:${color};">${icon}</span>
        <p style="font-size:20px; font-weight:600; margin-top:12px;">${title}</p>
        <p class="sub">${sub}</p>
      `;
    }

    async function run() {
      if (!token) {
        render('error', 'var(--md-error)', 'Invalid QR code', 'This link is missing a check-in code.');
        return;
      }
      if (!Auth.token) {
        // Not logged in — send to login, then bounce straight back here to finish check-in.
        location.href = `/login.html?next=${encodeURIComponent(location.pathname + location.search)}`;
        return;
      }
      try {
        const res = await api('/api/checkin', { method: 'POST', body: { token } });
        if (res.alreadyCheckedIn) {
          render('check_circle', 'var(--md-success)', "You're already checked in today", 'See you on the floor.');
        } else {
          render('check_circle', 'var(--md-success)', 'Checked in!', `Attendance marked for ${res.date}.`);
        }
        setTimeout(() => { location.href = '/profile.html'; }, 1800);
      } catch (e) {
        render('error', 'var(--md-error)', 'Check-in failed', e.message || 'Please ask the front desk for help.');
      }
    }

    run();
  </script>
</body>
</html>
